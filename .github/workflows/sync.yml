name: Sync to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      - name: Push squashed snapshot to HF Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git checkout --orphan hf-deploy
          git add -A
          git commit -m "Deploy ${{ github.sha }}"
          git push https://Achintya05:$HF_TOKEN@huggingface.co/spaces/Achintya05/fraud-detection-api hf-deploy:main -f